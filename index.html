<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAD Drawing Crop & Markup</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2313263d'/%3E%3Cpath d='M12 20h40M12 32h40M12 44h40M24 10v44M42 10v44' stroke='%236ee7f9' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#07111d;--panel:#101f31;--line:#28445e;--text:#e9f2f8;--muted:#9eb2c3;--cyan:#4dd8e8;--red:#ff5d6c;--amber:#ffc857}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Arial,"Microsoft YaHei",sans-serif;height:100vh;display:grid;grid-template-rows:auto 1fr}header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#0b1828;flex-wrap:wrap}h1{font-size:17px;margin:0 12px 0 0}button,select,label.file{background:var(--panel);color:var(--text);border:1px solid #35546d;border-radius:6px;padding:8px 11px;cursor:pointer}button:hover,label.file:hover{border-color:var(--cyan)}button.active{background:#164256;border-color:var(--cyan);color:#fff}.danger{border-color:#743a45}.spacer{flex:1}.status{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:1fr 290px;min-height:0}.stage{position:relative;overflow:hidden;background:#111b25}.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.side{border-left:1px solid var(--line);background:#0d1a2a;padding:14px;overflow:auto}.side h2{font-size:15px;margin:0 0 8px}.side p{color:var(--muted);font-size:13px;margin:6px 0 14px}.item{display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px;border:1px solid var(--line);border-radius:6px;margin:7px 0;background:#0b1725}.item b{font-size:13px}.item small{grid-column:1/3;color:var(--muted)}.item button{padding:3px 7px}.kbd{border:1px solid #536b7d;border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-size:12px;color:#dce8ef}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<header><h1>CAD 图纸视觉裁切标注</h1>
<label class="file">选择图纸图片<input id="images" type="file" accept="image/*" multiple hidden></label><select id="drawing" aria-label="当前图纸" disabled><option value="">请先选择图片</option></select>
<button data-mode="pan" class="active">拖动</button><button data-mode="rect">矩形框</button><button data-mode="vline">竖线</button><button data-mode="hline">横线</button>
<button id="undo">撤销</button><button id="redo">重做</button><button id="fit">适应窗口</button><button id="clear" class="danger">清空本图</button>
<span class="spacer"></span><button id="json">导出JSON</button><button id="csv">导出CSV</button><button id="png">保存标注PNG</button><label class="file">导入JSON<input id="import" type="file" accept=".json" hidden></label>
<span id="status" class="status"></span></header>
<div class="layout"><div class="stage"><canvas id="canvas"></canvas></div><aside class="side"><h2>切分框与直线</h2><p>先选择一张或多张本地图纸图片。图片仅在当前浏览器内处理，不会上传。滚轮缩放；拖动模式平移。矩形从左上拖到右下。直线会自动贯穿整张图。选中列表可删除。快捷键：<span class="kbd">R</span>框、<span class="kbd">V</span>竖线、<span class="kbd">H</span>横线、<span class="kbd">Space</span>拖动、<span class="kbd">Ctrl+Z</span>撤销。</p><div id="list"></div></aside></div>
<script>
const sources={};
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),stage=canvas.parentElement,statusEl=document.querySelector('#status'),listEl=document.querySelector('#list');
let current='',mode='pan',img=new Image(),scale=1,ox=0,oy=0,drag=null,preview=null;const marks={},history=[],future=[];
function snapshot(){history.push(JSON.stringify(marks));if(history.length>100)history.shift();future.length=0}
function restore(s){const v=JSON.parse(s);Object.keys(marks).forEach(k=>marks[k]=v[k]||[]);draw();renderList()}
function resize(){const d=devicePixelRatio||1;canvas.width=stage.clientWidth*d;canvas.height=stage.clientHeight*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function fit(){if(!img.naturalWidth)return;const w=stage.clientWidth,h=stage.clientHeight;scale=Math.min((w-30)/img.naturalWidth,(h-30)/img.naturalHeight);ox=(w-img.naturalWidth*scale)/2;oy=(h-img.naturalHeight*scale)/2;draw()}
function screenToImage(x,y){return{x:(x-ox)/scale,y:(y-oy)/scale}}
function drawMark(m,i,temp=false){ctx.save();ctx.strokeStyle=temp?'#ffc857':'#ff3b4f';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=2/scale;ctx.setLineDash(temp?[10/scale,6/scale]:[]);if(m.type==='rect')ctx.strokeRect(m.x,m.y,m.w,m.h);else{ctx.beginPath();if(m.type==='vline'){ctx.moveTo(m.x,0);ctx.lineTo(m.x,img.naturalHeight)}else{ctx.moveTo(0,m.y);ctx.lineTo(img.naturalWidth,m.y)}ctx.stroke()}ctx.setLineDash([]);ctx.font=`${16/scale}px Arial`;ctx.fillText(temp?'预览':`${current}-${String(i+1).padStart(3,'0')}`,m.x+5/scale,(m.y||18/scale)+18/scale);ctx.restore()}
function draw(){const w=stage.clientWidth,h=stage.clientHeight;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);if(img.complete)ctx.drawImage(img,0,0);(marks[current]||[]).forEach(drawMark);if(preview)drawMark(preview,0,true);ctx.restore();statusEl.textContent=`${current||'未选择图纸'}｜${(marks[current]||[]).length}项｜缩放 ${Math.round(scale*100)}%`}
function renderList(){listEl.innerHTML='';(marks[current]||[]).forEach((m,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<b>${current}-${String(i+1).padStart(3,'0')} · ${m.type==='rect'?'矩形':m.type==='vline'?'竖线':'横线'}</b><button>删除</button><small>${m.type==='rect'?`x ${m.x.toFixed(1)}, y ${m.y.toFixed(1)}, w ${m.w.toFixed(1)}, h ${m.h.toFixed(1)}`:m.type==='vline'?`x ${m.x.toFixed(1)}`:`y ${m.y.toFixed(1)}`}</small>`;d.querySelector('button').onclick=()=>{snapshot();marks[current].splice(i,1);draw();renderList()};listEl.appendChild(d)})}
function load(){img=new Image();if(!current||!sources[current]){img.onload=null;draw();renderList();return}img.onload=()=>{fit();renderList()};img.src=sources[current]}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=screenToImage(e.offsetX,e.offsetY);drag={sx:e.offsetX,sy:e.offsetY,p,ox,oy};if(mode!=='pan')snapshot()});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=screenToImage(e.offsetX,e.offsetY);if(mode==='pan'){ox=drag.ox+e.offsetX-drag.sx;oy=drag.oy+e.offsetY-drag.sy}else if(mode==='rect'){preview={type:'rect',x:Math.min(drag.p.x,p.x),y:Math.min(drag.p.y,p.y),w:Math.abs(p.x-drag.p.x),h:Math.abs(p.y-drag.p.y)}}else if(mode==='vline')preview={type:'vline',x:p.x,y:0};else preview={type:'hline',x:0,y:p.y};draw()});
canvas.addEventListener('pointerup',()=>{if(preview){if(preview.type!=='rect'||(preview.w>5&&preview.h>5))marks[current].push(preview);preview=null;renderList()}drag=null;draw()});
canvas.addEventListener('wheel',e=>{e.preventDefault();const before=screenToImage(e.offsetX,e.offsetY),f=e.deltaY<0?1.12:.89;scale=Math.max(.05,Math.min(8,scale*f));ox=e.offsetX-before.x*scale;oy=e.offsetY-before.y*scale;draw()},{passive:false});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});
document.querySelector('#drawing').onchange=e=>{current=e.target.value;load()};document.querySelector('#images').onchange=async e=>{for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;let key=f.name;let n=2;while(Object.hasOwn(sources,key))key=`${f.name} (${n++})`;sources[key]=URL.createObjectURL(f);marks[key]=[];const opt=document.createElement('option');opt.value=key;opt.textContent=key;document.querySelector('#drawing').appendChild(opt)}const sel=document.querySelector('#drawing');if(sel.options.length>1){sel.disabled=false;sel.selectedIndex=1;current=sel.value;load()}e.target.value='';};document.querySelector('#fit').onclick=fit;document.querySelector('#clear').onclick=()=>{if(!current)return;snapshot();marks[current]=[];draw();renderList()};
document.querySelector('#undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify(marks));restore(history.pop())};document.querySelector('#redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify(marks));restore(future.pop())};
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.querySelector('#json').onclick=()=>download('cad-cut-marks.json',JSON.stringify({version:1,images:Object.fromEntries(Object.keys(sources).map(k=>[k,{file:k,width:k===current?img.naturalWidth:null,height:k===current?img.naturalHeight:null}])),marks},null,2),'application/json');
document.querySelector('#csv').onclick=()=>{let s='drawing,id,type,x,y,width,height\n';Object.entries(marks).forEach(([k,a])=>a.forEach((m,i)=>s+=`${k},${k}-${String(i+1).padStart(3,'0')},${m.type},${m.x??''},${m.y??''},${m.w??''},${m.h??''}\n`));download('cad-cut-marks.csv','\ufeff'+s,'text/csv')};
document.querySelector('#png').onclick=()=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const q=c.getContext('2d');q.drawImage(img,0,0);q.strokeStyle='#ff3048';q.fillStyle='#ff3048';q.lineWidth=4;q.font='24px Arial';marks[current].forEach((m,i)=>{if(m.type==='rect')q.strokeRect(m.x,m.y,m.w,m.h);else{q.beginPath();m.type==='vline'?(q.moveTo(m.x,0),q.lineTo(m.x,c.height)):(q.moveTo(0,m.y),q.lineTo(c.width,m.y));q.stroke()}q.fillText(`${current}-${String(i+1).padStart(3,'0')}`,m.x+6,(m.y||4)+26)});c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${current}-标注.png`;a.click()},'image/png')};
document.querySelector('#import').onchange=async e=>{const data=JSON.parse(await e.target.files[0].text());snapshot();Object.keys(data.marks||{}).forEach(k=>marks[k]=data.marks[k]||[]);draw();renderList()};
addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();document.querySelector('#undo').click();return}const map={r:'rect',v:'vline',h:'hline',' ':'pan'};if(map[e.key.toLowerCase()])document.querySelector(`[data-mode="${map[e.key.toLowerCase()]}"]`).click()});addEventListener('resize',resize);resize();draw();renderList();
</script></body></html>
